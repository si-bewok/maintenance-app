<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/src/assets/img/logo-small.png" />
        <title>Login | e-Maintenance</title>
    </head>
    <body class="min-h-screen bg-gray-100 flex items-center justify-center">
        <div class="w-full max-w-sm md:max-w-xl px-6">
            <div class="bg-white rounded-2xl shadow-lg p-6 space-y-6">
                <!-- Logo + App Name -->
                <div class="mb-10 flex flex-col items-center space-y-0">
                    <img id="appLogo" alt="Logo Medisian" class="mx-auto h-25 w-auto" />
                    <h2 class="text-center text-2xl tracking-tight font-semibold text-secondary">e-Maintenance</h2>
                </div>

                <!-- Form -->
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="text-sm text-gray-600">Email Google</label>
                        <input type="email" id="email" placeholder="nama@gmail.com" class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                        <p id="emailError" class="text-xs text-red-500 mt-1 hidden">Email tidak valid</p>
                    </div>

                    <div>
                        <label class="text-sm text-gray-600">Password</label>
                        <input type="password" id="password" placeholder="••••••••" class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                        <p id="passwordError" class="text-xs text-red-500 mt-1 hidden">Password tidak valid</p>
                    </div>

                    <div class="text-center mt-7">
                        <a class="text-base font-semibold text-primary hover:text-primary/80 active:text-primary/60 transition-colors duration-200" href="/forgot-password.html">Lupa password?</a>
                    </div>

                    <button type="submit" class="mt-5 w-full bg-secondary hover:bg-secondary/80 active:bg-secondary/60 text-white rounded-xl py-2 font-medium active:scale-95 transition">Login</button>

                    <span class="flex items-center justify-center gap-2 text-xs text-gray-500 mt-3">
                        Terintegrasi dengan
                        <svg class="w-4 h-4" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.36 1.53 7.82 2.82l5.77-5.77C34.62 3.5 29.79 1.5 24 1.5 14.94 1.5 7.14 6.88 3.51 14.74l6.73 5.23C12.02 14.01 17.55 9.5 24 9.5z" />
                            <path fill="#4285F4" d="M46.5 24c0-1.57-.14-3.08-.41-4.55H24v8.62h12.72c-.55 2.97-2.22 5.49-4.73 7.18l7.27 5.66C43.94 36.59 46.5 30.82 46.5 24z" />
                            <path fill="#FBBC05" d="M10.24 28.97A14.49 14.49 0 0 1 9.5 24c0-1.73.3-3.39.74-4.97l-6.73-5.23A22.48 22.48 0 0 0 1.5 24c0 3.61.86 7.02 2.01 10.2l6.73-5.23z" />
                            <path fill="#34A853" d="M24 46.5c5.79 0 10.62-1.92 14.16-5.23l-7.27-5.66c-2.02 1.35-4.6 2.14-6.89 2.14-6.45 0-11.98-4.51-13.76-10.47l-6.73 5.23C7.14 41.12 14.94 46.5 24 46.5z" />
                        </svg>
                        Google
                    </span>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 opacity-0 translate-y-5 pointer-events-none transition-all duration-300 ease-out bg-red-500 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium">
            Login gagal. Periksa kembali email & password.
        </div>

        <script type="module" src="/src/js/modules/login.js"></script>
    </body>
</html>
