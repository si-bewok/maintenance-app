<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/src/assets/img/logo-small.png" />
        <title>Detail Alat | e-Maintenance</title>
    </head>

    <body class="bg-gray-100 min-h-screen overflow-x-hidden">
        <!-- LOADING SCREEN (SAVE) -->
        <div id="loadingOverlay" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden">
            <div class="bg-white rounded-2xl px-8 py-6 flex flex-col items-center gap-3 shadow-xl">
                <svg class="w-8 h-8 text-primary animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
                </svg>
                <p class="text-sm font-medium text-secondary">Menyimpan data...</p>
            </div>
        </div>

        <!-- HEADER -->
        <header class="bg-white shadow-sm sticky top-0 z-40">
            <div class="flex items-center justify-between px-4 py-3">
                <!-- Back Button -->
                <a href="/tool-lists.html" aria-label="Kembali" class="text-secondary hover:text-secondary/80 active:text-secondary/60 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>

                <!-- Title (nama alat) -->
                <h1 id="toolName" class="font-semibold text-lg text-secondary truncate max-w-[60%] text-center">Nama Alat</h1>

                <!-- Save Button -->
                <button id="saveBtn" type="button" aria-label="Simpan" class="text-secondary hover:text-secondary/80 active:text-secondary/60 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Body floppy disk -->
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <!-- Label area (kotak putih di atas) -->
                        <rect x="7" y="3" width="10" height="6" rx="1" />
                        <!-- Lubang kecil slider -->
                        <rect x="13" y="4" width="2" height="4" rx="0.5" fill="currentColor" stroke="none" />
                        <!-- Kotak baca di bawah -->
                        <rect x="7" y="13" width="10" height="6" rx="1" />
                    </svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="relative bg-white">
                <div id="tabs" class="flex text-sm font-medium text-secondary">
                    <button class="tab-item flex-1 py-3 text-center text-primary" data-tab="data-alat">Data Alat</button>
                    <button class="tab-item flex-1 py-3 text-center" data-tab="data-kunjungan">Data Kunjungan</button>
                </div>
                <span id="tab-indicator" class="absolute bottom-0 left-0 h-0.5 bg-primary transition-all duration-300 ease-out"></span>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="w-full">
            <!-- ===================== -->
            <!-- TAB: DATA ALAT (FORM) -->
            <!-- ===================== -->
            <section id="panel-data-alat" class="tab-panel p-2">
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <form id="toolForm" class="space-y-4">
                        <!-- Nama Alat -->
                        <div>
                            <label class="text-sm text-gray-600">Nama Alat <span class="mt-1 text-red-500 text-xs">*</span></label>
                            <input
                                id="fieldNamaAlat"
                                type="text"
                                placeholder="Contoh: Defibrillator"
                                class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                required
                            />
                        </div>

                        <!-- Merk -->
                        <div>
                            <label class="text-sm text-gray-600">Merk <span class="mt-1 text-red-500 text-xs">*</span></label>
                            <input id="fieldMerk" type="text" placeholder="Contoh: Zoll" class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required />
                        </div>

                        <!-- Tipe -->
                        <div>
                            <label class="text-sm text-gray-600">Tipe <span class="mt-1 text-red-500 text-xs">*</span></label>
                            <input id="fieldTipe" type="text" placeholder="Contoh: AED Plus" class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required />
                        </div>

                        <!-- Nomor Seri -->
                        <div>
                            <label class="text-sm text-gray-600">Nomor Seri <span class="mt-1 text-red-500 text-xs">*</span></label>
                            <input
                                id="fieldNomorSeri"
                                type="text"
                                placeholder="Contoh: SN-20240001"
                                class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                required
                            />
                        </div>

                        <!-- Lokasi -->
                        <div>
                            <label class="text-sm text-gray-600">Lokasi <span class="mt-1 text-red-500 text-xs">*</span></label>
                            <input id="fieldLokasi" type="text" placeholder="Contoh: ICU Lantai 2" class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required />
                        </div>

                        <!-- Tahun Pengadaan -->
                        <div>
                            <label class="text-sm text-gray-600">Tahun Pengadaan</label>
                            <input
                                id="fieldTahun"
                                type="number"
                                placeholder="Contoh: 2022"
                                min="2000"
                                max="2099"
                                class="mt-1 w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            />
                        </div>

                        <!-- Status -->
                        <div>
                            <label class="text-sm text-gray-600">Status <span class="mt-1 text-red-500 text-xs">*</span></label>
                            <div class="relative mt-1">
                                <select id="fieldStatus" class="appearance-none w-full rounded-xl text-gray-800 border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" required>
                                    <option value="" disabled>Pilih status</option>
                                    <option value="0" selected>Baik</option>
                                    <option value="1">Rusak</option>
                                </select>
                                <!-- Custom arrow -->
                                <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
                                    <svg class="w-4 h-4 text-secondary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <!-- ========================== -->
            <!-- TAB: DATA KUNJUNGAN (LIST) -->
            <!-- ========================== -->
            <section id="panel-data-kunjungan" class="tab-panel hidden">
                <!-- List kunjungan -->
                <div id="kunjunganList" class="w-full p-2 space-y-1">
                    <!-- Render via JS -->

                    <!-- Contoh card kunjungan (dummy, nanti render via JS) -->
                    <a href="#" class="grid grid-cols-[1fr_auto] items-start gap-3 p-4 bg-white border border-y-gray-100 shadow-sm hover:shadow-md transition duration-200">
                        <div class="space-y-1 min-w-0">
                            <!-- Tanggal -->
                            <p class="text-xs text-gray-400">12 Januari 2025</p>
                            <!-- Teknisi -->
                            <p class="text-sm font-semibold text-gray-800 truncate">Teknisi: Budi Santoso</p>
                            <!-- User -->
                            <p class="text-sm text-gray-500 truncate">User: Dr. Siti Rahayu</p>
                        </div>
                        <!-- Status -->
                        <div class="flex items-center justify-end pt-1">
                            <span class="text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap bg-green-100 text-green-600"> Selesai </span>
                        </div>
                    </a>
                </div>

                <div id="kunjunganSentinel" class="h-10"></div>
            </section>
        </main>

        <!-- TOAST NOTIFICATION -->
        <div
            id="toast"
            class="fixed bottom-6 left-1/2 -translate-x-1/2 opacity-0 translate-y-5 pointer-events-none transition-all duration-300 ease-out text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium whitespace-nowrap"
        ></div>

        <script type="module" src="/src/js/modules/tool-detail.js"></script>
    </body>
</html>
