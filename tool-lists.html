<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/src/assets/img/logo-small.png" />
        <title>Daftar Alkes | e-Maintenance</title>
    </head>

    <body class="bg-gray-100 min-h-screen overflow-x-hidden">
        <!-- HEADER -->
        <header class="bg-white shadow-sm sticky top-0 z-40">
            <div class="flex items-center justify-between px-4 py-3">
                <!-- Back Button -->
                <a href="/index.html" class="text-secondary hover:text-secondary/80 active:text-secondary/60 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>

                <!-- Title -->
                <h1 class="font-semibold text-lg text-secondary">Daftar Alat Kesehatan</h1>

                <!-- Toggle Button -->
                <button id="searchToggle" type="button" class="text-secondary bg-white hover:bg-white/80 active:bg-white/60 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20 20l-3.5-3.5" />
                    </svg>
                </button>
            </div>

            <!-- 🔍 SEARCH FORM (NEW POSITION) -->
            <div id="searchWrapper" class="px-3 py-1 overflow-hidden max-h-0 opacity-0 transition-all duration-300 ease-in-out">
                <form id="searchForm" class="flex items-center gap-2 pb-2">
                    <input id="searchInput" type="text" name="query" placeholder="Cari alat..." class="flex-1 px-3 py-2 text-sm text-secondary rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" />

                    <button type="submit" class="text-sm bg-primary hover:bg-primary/80 active:bg-primary/60 text-white px-4 py-2 rounded-lg">Cari</button>
                </form>
            </div>

            <!-- Tabs Container -->
            <div class="relative bg-white">
                <div id="tabs" class="flex text-sm font-medium text-secondary">
                    <button class="tab-item flex-1 py-3 text-center text-primary">Semua</button>
                    <button class="tab-item flex-1 py-3 text-center">Terbaru</button>
                    <button class="tab-item flex-1 py-3 text-center">Status Baik</button>
                    <button class="tab-item flex-1 py-3 text-center">Status Rusak</button>
                </div>

                <!-- Sliding Underline -->
                <span id="tab-indicator" class="absolute bottom-0 left-0 h-0.5 bg-primary transition-all duration-300 ease-out"> </span>
            </div>
        </header>

        <!-- LIST CONTENT -->
        <main id="toolList" class="w-full p-2 space-y-1">
            <!-- Render via JS -->
        </main>

        <div id="scrollSentinel" class="h-10"></div>

        <!-- FLOATING QR BUTTON -->
        <button class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-primary hover:bg-primary/80 active:bg-primary/60 text-white shadow-lg flex items-center justify-center active:scale-90 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 4h4v4H4zM16 4h4v4h-4z
                        M4 16h4v4H4zM16 16h4v4h-4z
                        M9 9h6v6H9z"
                />
            </svg>
        </button>

        <script type="module" src="/src/js/modules/tool-list.js"></script>
    </body>
</html>
